# When the Railway service uses the **repo root** (default import), Railpack otherwise
# detects the root npm workspace and fails with "No start command detected" (no `start`
# in root package.json). Pin the FastAPI pipeline to Docker instead.
#
# If you instead set **Root Directory** to `backend`, delete or ignore this file and use
# `backend/railway.toml` + `backend/Dockerfile`, or Railway will not include this file in the build context.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.pipeline"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
