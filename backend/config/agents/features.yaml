role: senior product manager with 10 years of B2B SaaS experience
model: claude-sonnet-4-5

instructions: |
  Generate between 4 and 8 product features that directly address the problems identified.
  Each feature must solve a specific user problem and be grounded in the research context.
  Every feature must reference evidence from the research.
  Every feature must include a linked_problems list with the exact titles of the problems it solves.
  The reasoning field must explicitly cite which tagged inputs justify the feature set before the items array.
  Do not use these words unless directly quoted from the tagged inputs: delve, robust, seamless,
  scalable, innovative, best-in-class, holistic, user-friendly.
  Do not write generic claims such as improve efficiency, streamline workflow, or handle errors gracefully
  unless the exact wording appears in the tagged inputs.

  Return ONLY a JSON object with a top-level reasoning field and an items array of feature objects.
  No preamble, no markdown, no explanation.

  If a <rag_context> block is present in your input, you MUST:
  1. Treat each rag_context item as a primary source for your output
  2. Reference specific rag_context items in every research_evidence field using the format: '[Source: {title}]'
  3. If a claim cannot be traced to rag_context or the research_context, write 'Insufficient source data' in that field rather than inventing evidence
  4. Prioritize rag_context items with higher relevance scores

  For every item you generate:
  - source_ids: list the id values from rag_context items you used as evidence. If no rag_context was provided, use an empty list.
  - citation_confidence: set to 'high' if every claim traces to a rag_context item, 'medium' if some claims are inferred, 'insufficient' if you could not find supporting evidence in rag_context.
  - If citation_confidence would be 'insufficient' for ALL items, output a single item with title='Insufficient source data' and description explaining what context is missing.

  If an <analytics_context> block is present, use metric targets (baseline vs current) to set measurable acceptance criteria.

output_schema:
  type: list
  sections:
    reasoning: string
  fields:
    id: string
    title: string
    description: string
    user_problem_it_solves: string
    priority: "high | medium | low"
    impact: "high | medium | low"
    effort: "high | medium | low"
    confidence: number
    acceptance_criteria: string
    research_evidence: "Direct quote or reference from rag_context or research_context — required, no invented evidence"
    linked_problems: list
    source_ids: list
    citation_confidence: "high | medium | insufficient"
  groups: null

critic:
  binary_checks:
    - name: evidence_cited
      pass_condition: "Every claim and linked_problem traces to a verbatim quote or specific data point from the research context"
      fail_condition: "Any claim invented or not traceable to research input"
    - name: metrics_concrete
      pass_condition: "impact, effort, and confidence are valid enum/numeric values; acceptance_criteria uses measurable thresholds"
      fail_condition: "Any metric uses vague language: fast, improved, scalable, better, seamless"
    - name: linked_problems_valid
      pass_condition: "linked_problems is a non-empty list and each entry matches a known problem title from memory"
      fail_condition: "linked_problems is empty, missing, or contains names not found in the problems list"

use_critic: true
validate_evidence_chain: true
max_retries: 2

token_control:
  max_output_tokens: 8192
  retries: 2

memory:
  read:
    strategy: top_k
    keys:
      product_context: 1
      problems: 7
      ingest: 10
  write:
    key: features
    mode: overwrite
