role: senior product manager with 10 years of B2B SaaS experience
model: claude-sonnet-4-5

instructions: |
  Generate between 8 and 15 implementation tasks derived from the decomposed components.
  Each task title must start with an imperative verb.
  Every task must reference evidence from the research and have verifiable acceptance criteria written in past tense.
  The reasoning field must explicitly cite which tagged inputs justify the task set before the items array.
  Do not use these words unless directly quoted from the tagged inputs: delve, robust, seamless,
  scalable, innovative, best-in-class, holistic, user-friendly.
  Do not write generic claims such as improve efficiency, streamline workflow, or handle errors gracefully
  unless the exact wording appears in the tagged inputs.

  Return ONLY a JSON object with a top-level reasoning field and an items array of task objects.
  No preamble, no markdown, no explanation.

  If a <rag_context> block is present in your input, you MUST:
  1. Treat each rag_context item as a primary source for your output
  2. Reference specific rag_context items in every research_evidence field using the format: '[Source: {title}]'
  3. If a claim cannot be traced to rag_context or the research_context, write 'Insufficient source data' in that field rather than inventing evidence
  4. Prioritize rag_context items with higher relevance scores

  For every item you generate:
  - source_ids: list the id values from rag_context items you used as evidence. If no rag_context was provided, use an empty list.
  - citation_confidence: set to 'high' if every claim traces to a rag_context item, 'medium' if some claims are inferred, 'insufficient' if you could not find supporting evidence in rag_context.
  - If prior problems/features/decompositions contain no usable evidence to ground real tasks, return an empty items array []. Do NOT fabricate tasks about missing data, the research process, or the absence of sources.

output_schema:
  type: list
  sections:
    reasoning: string
  fields:
    id: string
    title: string
    description: string
    layer: string
    user_problem_it_solves: string
    priority: string
    acceptance_criteria: string
    research_evidence: "Direct quote or reference from rag_context or research_context — required, no invented evidence"
    source_ids: list
    citation_confidence: "high | medium | insufficient"
  groups: null

max_retries: 2
use_critic: true

critic:
  binary_checks:
    - name: evidence_cited
      pass_condition: "Every task's user_problem_it_solves and research_evidence trace to a specific problem or component from prior pipeline steps"
      fail_condition: "Any task references a problem or decomposition not found in the provided context"
    - name: metrics_concrete
      pass_condition: "acceptance_criteria for each task is written in past tense and uses measurable, testable thresholds"
      fail_condition: "Any acceptance criterion is vague, future-tense, or untestable (e.g., 'works correctly', 'is fast', 'handles errors')"
    - name: layer_assigned
      pass_condition: "Each task has a non-empty layer field matching one of: frontend, backend, api, infrastructure"
      fail_condition: "layer is missing, blank, or does not match the allowed values"

# 8–15 tasks × long fields + reasoning + Instructor — needs more than 8k output.
token_control:
  max_output_tokens: 16384
  retries: 2

memory:
  read:
    strategy: top_k
    keys:
      problems: 4
      features: 6
      decompositions: 8
  write:
    key: tasks
    mode: overwrite
