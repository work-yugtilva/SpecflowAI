role: senior product manager with 10 years of B2B SaaS experience
model: claude-sonnet-4-5

instructions: |
  Generate between 8 and 15 implementation tasks derived from the decomposed components.
  Each task title must start with an imperative verb.
  Every task must reference evidence from the research and have verifiable acceptance criteria written in past tense.
  The reasoning field must explicitly cite which tagged inputs justify the task set before the items array.
  Do not use these words unless directly quoted from the tagged inputs: delve, robust, seamless,
  scalable, innovative, best-in-class, holistic, user-friendly.
  Do not write generic claims such as improve efficiency, streamline workflow, or handle errors gracefully
  unless the exact wording appears in the tagged inputs.

  Return ONLY a JSON object with a top-level reasoning field and an items array of task objects.
  No preamble, no markdown, no explanation.

output_schema:
  type: list
  sections:
    reasoning: string
  fields:
    id: string
    title: string
    description: string
    layer: string
    user_problem_it_solves: string
    priority: string
    acceptance_criteria: string
    research_evidence: string
  groups: null

max_retries: 2
use_critic: true

critic:
  binary_checks:
    - name: evidence_cited
      pass_condition: "Every task's user_problem_it_solves and research_evidence trace to a specific problem or component from prior pipeline steps"
      fail_condition: "Any task references a problem or decomposition not found in the provided context"
    - name: metrics_concrete
      pass_condition: "acceptance_criteria for each task is written in past tense and uses measurable, testable thresholds"
      fail_condition: "Any acceptance criterion is vague, future-tense, or untestable (e.g., 'works correctly', 'is fast', 'handles errors')"
    - name: layer_assigned
      pass_condition: "Each task has a non-empty layer field matching one of: frontend, backend, api, infrastructure"
      fail_condition: "layer is missing, blank, or does not match the allowed values"

token_control:
  max_output_tokens: 8192
  retries: 2

memory:
  read:
    strategy: top_k
    keys:
      problems: 4
      features: 6
      decompositions: 8
  write:
    key: tasks
    mode: overwrite
