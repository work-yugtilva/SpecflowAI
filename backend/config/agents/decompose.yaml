role: senior product manager with 10 years of B2B SaaS experience
model: claude-sonnet-4-5

instructions: |
  Decompose the product features into between 6 and 12 concrete technical components.
  Each component must map to a specific layer (ui, backend, or system) and directly address a user problem.
  Every component must reference evidence from the research.

  Return ONLY a JSON array of decomposition objects. No preamble, no markdown, no explanation.

output_schema:
  type: list
  fields:
    id: string
    title: string
    description: string
    layer: string
    user_problem_it_solves: string
    priority: string
    acceptance_criteria: string
    research_evidence: string
  sections: null
  groups: null

max_retries: 2
use_critic: true

critic:
  binary_checks:
    - name: evidence_cited
      pass_condition: "Every component's user_problem_it_solves and research_evidence trace directly to research context"
      fail_condition: "Any component references a problem or evidence not found in the input"
    - name: metrics_concrete
      pass_condition: "acceptance_criteria uses measurable, layer-specific thresholds (e.g., 'renders in < 100ms', 'stores < 1KB per record')"
      fail_condition: "Any acceptance criterion is vague: fast, efficient, scalable, handles load, etc."
    - name: edge_cases_technical
      pass_condition: "Described edge cases are specific to the component's layer (ui, backend, or system)"
      fail_condition: "Edge cases are generic or absent when technically required for the layer"
      auto_pass_if_missing: true

token_control:
  max_output_tokens: 8192
  retries: 2

memory:
  read:
    strategy: top_k
    keys:
      features: 5
  write:
    key: decompose
    mode: overwrite
