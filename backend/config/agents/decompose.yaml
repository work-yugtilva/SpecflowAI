role: senior product manager with 10 years of B2B SaaS experience
output_key: decompositions
model: claude-sonnet-4-5

instructions: |
  Decompose the product features into between 6 and 12 concrete technical components.
  Each component must map to a specific layer (ui, backend, or system) and directly address a user problem.
  Every component must reference evidence from the research.
  The reasoning field must explicitly cite which tagged inputs justify the component set before the items array.
  Do not use these words unless directly quoted from the tagged inputs: delve, robust, seamless,
  scalable, innovative, best-in-class, holistic, user-friendly.
  Do not write generic claims such as improve efficiency, streamline workflow, or handle errors gracefully
  unless the exact wording appears in the tagged inputs.

  Return ONLY a JSON object with a top-level reasoning field and an items array of decomposition objects.
  No preamble, no markdown, no explanation.

  If a <rag_context> block is present in your input, you MUST:
  1. Treat each rag_context item as a primary source for your output
  2. Reference specific rag_context items in every research_evidence field using the format: '[Source: {title}]'
  3. If a claim cannot be traced to rag_context or the research_context, write 'Insufficient source data' in that field rather than inventing evidence
  4. Prioritize rag_context items with higher relevance scores

  For every item you generate:
  - source_ids: list the id values from rag_context items you used as evidence. If no rag_context was provided, use an empty list.
  - citation_confidence: set to 'high' if every claim traces to a rag_context item, 'medium' if some claims are inferred, 'insufficient' if you could not find supporting evidence in rag_context.
  - Even if citation_confidence is 'insufficient', still generate all components using the research_context and prior context available. Never output a sentinel or placeholder item — always return real components.

output_schema:
  type: list
  sections:
    reasoning: string
  fields:
    id: string
    title: string
    description: string
    layer: string
    user_problem_it_solves: string
    priority: string
    acceptance_criteria: string
    research_evidence: "Direct quote or reference from rag_context or research_context — required, no invented evidence"
    source_ids: list
    citation_confidence: "high | medium | insufficient"
  groups: null

max_retries: 2
use_critic: true

critic:
  binary_checks:
    - name: evidence_cited
      pass_condition: "Every component's user_problem_it_solves and research_evidence trace directly to research context"
      fail_condition: "Any component references a problem or evidence not found in the input"
    - name: metrics_concrete
      pass_condition: "acceptance_criteria uses measurable, layer-specific thresholds (e.g., 'renders in < 100ms', 'stores < 1KB per record')"
      fail_condition: "Any acceptance criterion is vague: fast, efficient, scalable, handles load, etc."
    - name: edge_cases_technical
      pass_condition: "Described edge cases are specific to the component's layer (ui, backend, or system)"
      fail_condition: "Edge cases are generic or absent when technically required for the layer"
      auto_pass_if_missing: true

token_control:
  max_output_tokens: 8192
  retries: 2

memory:
  read:
    strategy: top_k
    keys:
      product_context: 1
      ingest: 10
      problems: 4
      features: 8
  write:
    key: decompose
    mode: overwrite
