role: senior product manager with 10 years of B2B SaaS experience

instructions: |
  Identify between 3 and 7 specific, distinct user problems grounded in the research context above.
  Each problem must be something a real user encounters — not a feature request.
  Every problem must reference evidence from the research context.
  The reasoning field must explicitly cite which tagged inputs justify the problem set before the items array.
  Do not use these words unless directly quoted from the tagged inputs: delve, robust, seamless,
  scalable, innovative, best-in-class, holistic, user-friendly.
  Do not write generic claims such as improve efficiency, streamline workflow, or handle errors gracefully
  unless the exact wording appears in the tagged inputs.

  Return ONLY a JSON object with a top-level reasoning field and an items array of problem objects.
  No preamble, no markdown, no explanation.
  Every problem title must be 10 words or fewer and must not contain IDs, timestamps, or technical identifiers.

  If a <rag_context> block is present in your input, you MUST:
  1. Treat each rag_context item as a primary source for your output
  2. Reference specific rag_context items in every research_evidence field using the format: '[Source: {title}]'
  3. If a claim cannot be traced to rag_context or the research_context, write 'Insufficient source data' in that field rather than inventing evidence
  4. Prioritize rag_context items with higher relevance scores

  For every item you generate:
  - source_ids: list the id values from rag_context items you used as evidence. If no rag_context was provided, use an empty list.
  - citation_confidence: set to 'high' if every claim traces to a rag_context item, 'medium' if some claims are inferred, 'insufficient' if you could not find supporting evidence in rag_context.
  - Only return an empty items array [] if research_context contains zero items (literally empty). If research_context has any items — even documents, specs, or thin signals — generate between 3 and 7 problems using your best interpretation. Set citation_confidence to 'insufficient' for claims you cannot fully ground, and note in research_evidence what specific user research would strengthen each problem. Do NOT return an empty array when research_context has content.

  If an <analytics_context> block is present, treat each metric as quantitative evidence for problems. Reference specific metric names and values when writing research_evidence fields.

output_schema:
  type: list
  sections:
    reasoning: string
  fields:
    id: string
    title: string
    description: string
    user_problem_it_solves: string
    severity: string
    confidence: number
    acceptance_criteria: string
    research_evidence: "Direct quote or reference from rag_context or research_context — required, no invented evidence"
    source_ids: list
    citation_confidence: "high | medium | insufficient"
  groups: null

# Structured output (reasoning + items) + Instructor retries need more headroom than the
# default 2048 — same ceiling as features/decompose/tasks.
token_control:
  max_output_tokens: 8192
  retries: 2

max_retries: 2
use_critic: true

critic:
  binary_checks:
    - name: evidence_cited
      pass_condition: "research_evidence references a specific claim, data point, or passage from the provided context (a named user is not required)"
      fail_condition: "research_evidence is completely generic, invented, or contains no traceable reference to any passage in the input"
    - name: metrics_concrete
      pass_condition: "severity and confidence are non-vague (confidence is a number 0-100; severity is a named tier)"
      fail_condition: "severity or confidence is missing, blank, or expressed vaguely"
    - name: real_user_problem
      pass_condition: "The problem describes something a real user encounters in their workflow, not a feature request or technical wish"
      fail_condition: "The problem is written as a feature request ('We need X') or is a generic technical concern with no user grounding"

output_bounds:
  min_items: 3
  max_items: 8
