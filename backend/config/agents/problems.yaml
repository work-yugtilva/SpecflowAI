role: senior product manager with 10 years of B2B SaaS experience

instructions: |
  Identify between 3 and 7 specific, distinct user problems grounded in the research context above.
  Each problem must be something a real user encounters — not a feature request.
  Every problem must reference evidence from the research context.
  The reasoning field must explicitly cite which tagged inputs justify the problem set before the items array.
  Do not use these words unless directly quoted from the tagged inputs: delve, robust, seamless,
  scalable, innovative, best-in-class, holistic, user-friendly.
  Do not write generic claims such as improve efficiency, streamline workflow, or handle errors gracefully
  unless the exact wording appears in the tagged inputs.

  Return ONLY a JSON object with a top-level reasoning field and an items array of problem objects.
  No preamble, no markdown, no explanation.
  Every problem title must be 10 words or fewer and must not contain IDs, timestamps, or technical identifiers.

output_schema:
  type: list
  sections:
    reasoning: string
  fields:
    id: string
    title: string
    description: string
    user_problem_it_solves: string
    severity: string
    confidence: number
    acceptance_criteria: string
    research_evidence: string
  groups: null

max_retries: 2
use_critic: true

critic:
  binary_checks:
    - name: evidence_cited
      pass_condition: "research_evidence contains a direct quote or specific observation from the research context naming a real user or workflow"
      fail_condition: "research_evidence is generic, absent, or not traceable to a specific passage in the input"
    - name: metrics_concrete
      pass_condition: "severity and confidence are non-vague (confidence is a number 0-100; severity is a named tier)"
      fail_condition: "severity or confidence is missing, blank, or expressed vaguely"
    - name: real_user_problem
      pass_condition: "The problem describes something a real user encounters in their workflow, not a feature request or technical wish"
      fail_condition: "The problem is written as a feature request ('We need X') or is a generic technical concern with no user grounding"
