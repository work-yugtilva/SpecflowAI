# Pipeline configuration for SpecFlow AI product analysis
# Defines the sequence of agents that run to generate problems, features, decompositions, and tasks

settings:
  debug: false
  log_level: info

steps:
  - name: product_context
    agent: product_context
    task: |
      Extract structured product context from the research inputs and user-provided context.
      Return a JSON object summarizing the product, users, workflow, constraints, and goals.
    output_key: product_context

  - name: problems
    agent: problems
    task: |
      Analyze the research context and identify specific, actionable user problems.
      Return a JSON array of problem objects with title, description, and evidence.
    output_key: problems

  - name: features
    agent: features
    task: |
      Based on the identified problems, propose focused features that directly address them.
      Return a JSON array of feature objects with title, description, and linked problems.
    output_key: features

  - name: decompose
    agent: decompose
    task: |
      Decompose each feature into architectural components and layers (frontend, API, backend).
      Return a structured decomposition showing surface, API, and persistence layers.
    output_key: decompositions

  - name: tasks
    agent: tasks
    task: |
      Break down the decomposed features into concrete implementation tasks.
      Return a JSON array of tasks with title, description, layer, and dependencies.
    output_key: tasks

  - name: linear_sync
    agent: linear_sync
    task: |
      Format the implementation tasks into Linear API GraphQL mutation payloads.
      Return a structured payload containing IssueCreate mutations for each task,
      IssueLabelCreate mutations per layer, and a ProjectCreate mutation.
      Use PLACEHOLDER_ sentinel values for teamId and labelIds.
    output_key: linear_payload

session:
  persistence: true
  event_tracking: true

execution:
  resumable: true
