role: "Tech Lead"

instructions: |
  Convert a system decomposition into a complete, prioritized list of executable
  development tasks, organized into three groups: Frontend Tasks, Backend Tasks,
  and System Tasks. Every task must be assigned to exactly one layer and must have
  a concrete deliverable — a single sentence describing what is done and verifiable
  when the task is complete. Frontend tasks cover UI components and interactions.
  Backend tasks cover APIs, services, and business logic. System tasks cover async
  jobs, data pipelines, permissions, and failure handling. Do not mix concerns across
  layers within a single task. Dependencies must be explicit — if a frontend task
  depends on a backend API existing, name that API task in its dependencies list.

steps:
  - Read the decomposition from memory including all three layers and data models
  - Generate frontend tasks from ui_layer components and interactions
  - Generate backend tasks from backend_layer apis, services, and business_logic
  - Generate system tasks from system_layer async_jobs, data_flow, permissions, and failure_handling
  - For each task, write a deliverable as one sentence stating what is complete and testable
  - Assign layer ("frontend", "backend", or "system") to each task
  - Identify cross-layer dependencies and name them explicitly in the dependencies list
  - Score each task on priority (1–5) and complexity (1–5)
  - Order tasks within each group so dependencies come first

generation_rules:
  - Every task must have a non-empty deliverable field
  - layer must be exactly "frontend", "backend", or "system" — no other values
  - Tasks must not span multiple layers — split mixed-concern tasks into separate tasks
  - Dependencies must reference actual task titles from other groups where applicable
  - Deliverable must be a complete sentence starting with a past-tense verb (e.g. "Implemented...", "Created...", "Deployed...")
  - Avoid overly large tasks — each task should be completable in 1–3 days
  - Ensure logical sequencing within each group
  - Keep tasks actionable

constraints:
  grouping: dynamic
  ordering: true

scoring:
  dimensions:
    - priority
    - complexity
    - dependency_weight
  method: "weighted"
  weights:
    priority: 1
    complexity: 1
    dependency_weight: 1

output_schema:
  type: object
  fields: {}
  groups:
    "Frontend Tasks":
      tasks:
        - title: string
          description: string
          layer: string
          deliverable: string
          dependencies: list
          attributes:
            priority: number
            complexity: number
          metadata: object
    "Backend Tasks":
      tasks:
        - title: string
          description: string
          layer: string
          deliverable: string
          dependencies: list
          attributes:
            priority: number
            complexity: number
          metadata: object
    "System Tasks":
      tasks:
        - title: string
          description: string
          layer: string
          deliverable: string
          dependencies: list
          attributes:
            priority: number
            complexity: number
          metadata: object
  sections: {}

critic:
  criteria:
    - deliverable_present
    - layer_assigned
    - execution_readiness
    - dependency_accuracy
    - completeness

use_critic: true

token_control:
  max_tokens: 8000
  max_output_tokens: 2000
  strategy: "trim"

compression:
  strategy: "top_k"
  params:
    k: 5

memory:
  read:
    strategy: "top_k"
    keys:
      problems: 2
      features: 2
      decompositions: 3
  write:
    key: "tasks"
    mode: "overwrite"
