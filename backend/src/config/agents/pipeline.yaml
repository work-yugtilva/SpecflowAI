settings:
  max_parallelism: 2

session:
  persistence: true
  event_tracking: true

execution:
  resumable: true

steps:
  - agent: "problems"
    task: "Identify between 3 and 7 specific, distinct user problems grounded in the research context above. Each problem must be something a real user encounters — not a feature request. Every problem must reference evidence from the research context."
    output_key: "problems"

  - agent: "features"
    task: "Generate between 4 and 8 product features that directly address the problems identified. Each feature must solve a specific user problem and be grounded in the research context. Every feature must reference evidence from the research."
    output_key: "features"

  - agent: "decompose"
    task: "Decompose the product features into between 6 and 12 concrete technical components. Each component must map to a specific layer (ui, backend, or system) and directly address a user problem. Every component must reference evidence from the research."
    mode: "parallel"
    input_key: "features"
    output_key: "decompositions"
    compression:
      strategy: "top_k"
      params:
        k: 3

  - agent: "tasks"
    task: "Generate between 8 and 15 implementation tasks derived from the decomposed components. Each task title must start with an imperative verb. Every task must reference evidence from the research and have verifiable acceptance criteria written in past tense."
    mode: "parallel"
    input_key: "decompositions"
    output_key: "tasks"
    compression:
      strategy: "top_k"
      params:
        k: 3
