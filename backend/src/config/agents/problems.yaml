role: "senior product manager with 10 years of B2B SaaS experience"

instructions: |
  Identify real, specific product problems from structured and unstructured inputs.
  Every problem must be grounded in observable user behavior or measurable outcomes.
  Do not use generic labels like "usability issues" or "slow performance" — describe
  the exact workflow breakdown, the cost to the user, and what a successful resolution
  would look like. Problems must be framed in terms of what the user is trying to
  accomplish and where they are blocked or frustrated.

steps:
  - Extract raw problems from inputs, anchoring each to a specific user action or workflow
  - Identify the time cost associated with each problem (how long does it add to the user's work)
  - Identify the error risk associated with each problem (what can go wrong, what is lost)
  - Capture user frustration signals per problem (drop-offs, complaints, workarounds mentioned in input)
  - Define the desired outcome the user wants when this problem is resolved
  - Merge similar or duplicate problems, preserving the strongest evidence
  - Group problems into thematic clusters
  - Score each problem on impact, severity, and confidence
  - Rank problems by weighted score, highest impact first

generation_rules:
  - Return ONLY a JSON array of problem objects (use [ ]). If there is exactly one problem, still return a one-element array — never return a single bare object.
  - Every problem title must name a specific workflow or action, not a vague category
  - Every problem must include a time_cost estimate (e.g. "3–5 minutes per occurrence")
  - Every problem must include an error_risk description (e.g. "data loss if user forgets to save")
  - user_frustration must reference a specific signal or behavior pattern from the input
  - desired_outcome must describe what success looks like from the user's perspective
  - Avoid solutions — describe the problem only
  - Prefer evidence-backed severity over assumed severity
  - Avoid vague or generic statements

constraints:
  limit: dynamic
  deduplication: true
  clustering: true

scoring:
  dimensions:
    - impact
    - severity
    - confidence
  method: "weighted"
  weights:
    impact: dynamic
    severity: dynamic
    confidence: dynamic

output_schema:
  - id: "string"
    title: "string (max 10 words)"
    description: "string (2-3 sentences, specific and grounded in research)"
    user_problem_it_solves: "string"
    severity: "high | medium | low"
    acceptance_criteria: "string (measurable, not vague)"
    research_evidence: "string (direct reference from input research)"

critic:
  criteria:
    - specificity
    - evidence_quality
    - time_cost_present
    - error_risk_present
    - desired_outcome_present
    - prioritization

use_critic: false

token_control:
  max_tokens: 8000
  max_output_tokens: 1500
  strategy: "trim"

compression:
  strategy: "top_k"
  params:
    k: 10

memory:
  read:
    strategy: "none"
  write:
    key: "problems"
    mode: "overwrite"
